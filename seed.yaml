# Glovebox demo data. Every call starts fresh from this file.
#
# Edit freely, then restart the agent (or `lk agent debugger restart`).
#   day:  0 = today, 1 = tomorrow, 2 = the day after, ...
#   time: 24-hour clock in quotes, like "07:00" or "16:30"
# All businesses and people are fictional.

business: Kestrel Line Freight
driver: Mike # owner and driver
truck: truck 1

loads:
  # On the road now: picked up this morning, delivering tonight.
  - number: "4471"
    status: in_transit # in_transit | scheduled
    broker: Bluegate Logistics
    pay: 2400.00 # flat rate, dollars
    free_time_minutes: 120 # waiting allowed before detention starts
    detention_per_hour: 50.00 # billed in quarter hours after free time
    deadhead_minutes: 0 # drive to this pickup from the previous stop
    pickup:
      facility: Harlan Point Cold Storage
      city: Springfield, Missouri
      day: 0
      time: "07:00"
    delivery:
      facility: Southmere Distribution
      city: Tulsa, Oklahoma
      day: 0
      time: "21:00"

  # Tomorrow: an early pickup an hour and a half from Tulsa. If 4471's
  # delivery runs late tonight, this is the load at risk.
  - number: "4482"
    status: scheduled
    broker: Prairie Run Logistics
    pay: 1650.00
    free_time_minutes: 120
    detention_per_hour: 45.00
    deadhead_minutes: 90
    pickup:
      facility: Corliss Packaging
      city: Muskogee, Oklahoma
      day: 1
      time: "06:00"
    delivery:
      facility: Lakemont Grocery DC
      city: Wichita, Kansas
      day: 1
      time: "14:00"

  # Day after tomorrow: afternoon pickup after the truck's service,
  # delivering the morning after.
  - number: "4490"
    status: scheduled
    broker: Bluegate Logistics
    pay: 2100.00
    free_time_minutes: 120
    detention_per_hour: 50.00
    deadhead_minutes: 240
    pickup:
      facility: Tamsin Foods Warehouse
      city: Joplin, Missouri
      day: 2
      time: "14:00"
    delivery:
      facility: Orrin Valley Foods
      city: Little Rock, Arkansas
      day: 3
      time: "07:00"

# Things on the schedule that aren't loads.
events:
  - what: Oil change and PM service
    place: Benton Truck and Trailer Repair in Joplin
    day: 2
    time: "08:00"
  - what: Home time starts
    place: home in Joplin
    day: 3
    time: "15:00"
